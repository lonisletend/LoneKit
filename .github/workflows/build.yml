name: 'publish'

# This will trigger the action on each push to the `main` branch.
# Pushes that only touch deployment config, docs or CI definitions do not cut a release.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'vercel.json'
      - '**/*.md'
      - 'LICENSE'
      - '.github/**'
      - 'docs/**'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            tauriTarget: universal-apple-darwin
            rustTargets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            tauriTarget: ''
            rustTargets: ''
          - platform: windows-latest
            tauriTarget: ''
            rustTargets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: install frontend dependencies
        run: npm install

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          {
            echo 'body<<EOF'
            node scripts/generate-release-notes.mjs
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
          releaseName: 'App v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauriTarget != '' && format('--target {0}', matrix.tauriTarget) || '' }}

      - name: package dist (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ARCHIVE="dist-v${VERSION}.tar.gz"
          npm run build
          tar -czf "$ARCHIVE" -C dist .
          gh api --method POST \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${ARCHIVE}" \
            -H "Content-Type: application/gzip" \
            --input "$ARCHIVE"

  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"app-v${VERSION}\") | .id" | head -n 1)
          if [ -z "$RELEASE_ID" ]; then
            echo "draft release app-v${VERSION} not found" >&2
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false

      # Counts installer downloads only; latest.json is polled by the updater and
      # by self-hosted deploy scripts, so the raw release total is not meaningful.
      - name: refresh download badge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rebuild on top of whatever main points at now, so a concurrent push
          # cannot turn this cosmetic update into a failed release run.
          git fetch origin main
          git switch -C main origin/main
          node scripts/generate-download-badge.mjs
          if git diff --quiet -- docs/badges/downloads.json; then
            echo "download badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/downloads.json
          git commit -m "chore: refresh download badge"
          git push origin main
